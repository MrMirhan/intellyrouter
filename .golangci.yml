version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*intellyrouter/internal/store.Store).Close
        - os.RemoveAll
        # tabwriter reports write errors from Flush.
        - fmt.Fprintf
        - fmt.Fprintln
