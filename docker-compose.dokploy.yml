# Dokploy deploy file. Dokploy reads docker-compose.yml by default; this
# file exists so a per-app Dokploy stack can be configured with a different
# name and image tag without touching the Coolify/generic compose file.
#
# All env values come from Dokploy's environment variable panel, set on the
# app's Configuration screen. The example values match docker-compose.yml.

services:
  intellyrouter:
    image: ghcr.io/mrmirhan/intellyrouter:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDE_VERSION: stable
    restart: unless-stopped
    environment:
      INTELLYROUTER_ADDR: 0.0.0.0:7117
      INTELLYROUTER_DATA: /data
      INTELLYROUTER_EVAL_TASKS: /eval-tasks
      CLAUDE_CONFIG_DIR: /data/.claude
      # CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-...   # headless login token
      # ANTHROPIC_API_KEY: sk-ant-api03-...         # or direct API-key
    ports:
      # Where the host publishes the gateway. Loopback by default, so a fresh
      # deploy is not exposed. Set INTELLYROUTER_PUBLISH to reach it from other
      # machines: a LAN or tailnet address such as 100.64.0.1:7117, or
      # 0.0.0.0:7117 behind a reverse proxy that terminates TLS.
      - "${INTELLYROUTER_PUBLISH:-127.0.0.1:7117}:7117"
    volumes:
      - gateway-data:/data
      - ./eval/tasks:/eval-tasks:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7117/api/hello"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gateway-data:
    name: intellyrouter-data
